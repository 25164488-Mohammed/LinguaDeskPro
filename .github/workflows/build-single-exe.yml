name: Build LinguaDesk Pro v7.0 Single-File EXE (All-In-One)

on:
  push:
    branches: [ "main", "master", "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-single-file-exe:
    name: Build Single-File EXE + OCR + Neural + Dictionary (Windows x64)
    runs-on: windows-latest

    steps:
      - name: 1. Checkout Repository
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          git init -q .
          git remote add origin "https://x-access-token:$($env:GH_TOKEN)@github.com/$($env:GITHUB_REPOSITORY).git"
          git fetch -q --depth=1 origin $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git checkout -q -f FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: 2. Verify Pre-installed .NET 8.0 SDK & Zero Vulnerable Packages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet --info
          dotnet restore src/LinguaDeskPro.SingleExe/LinguaDeskPro.SingleExe.csproj
          dotnet list src/LinguaDeskPro.SingleExe/LinguaDeskPro.SingleExe.csproj package --vulnerable

      - name: 3. Bundle Complete Arabic & English OCR Models (ara.traineddata + eng.traineddata) & Tesseract.js v5.1.1
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "resources/ocr/tessdata" | Out-Null
          New-Item -ItemType Directory -Force -Path "resources/neural_models" | Out-Null
          New-Item -ItemType Directory -Force -Path "ui/vendor/tesseract" | Out-Null

          Write-Host "Downloading official Tesseract Arabic & English OCR models (tessdata_fast)..."
          Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/ara.traineddata" -OutFile "resources/ocr/tessdata/ara.traineddata" -UseBasicParsing
          Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata" -OutFile "resources/ocr/tessdata/eng.traineddata" -UseBasicParsing
          Copy-Item "resources/ocr/tessdata/ara.traineddata" "resources/ocr/ara.traineddata" -Force
          Copy-Item "resources/ocr/tessdata/eng.traineddata" "resources/ocr/eng.traineddata" -Force

          Write-Host "Downloading latest patched Tesseract.js v5.1.1 offline runtime..."
          Invoke-WebRequest -Uri "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js" -OutFile "ui/vendor/tesseract/tesseract.min.js" -UseBasicParsing
          Invoke-WebRequest -Uri "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js" -OutFile "ui/vendor/tesseract/worker.min.js" -UseBasicParsing
          Invoke-WebRequest -Uri "https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.0/tesseract-core.wasm.js" -OutFile "ui/vendor/tesseract/tesseract-core.wasm.js" -UseBasicParsing

          if (Test-Path "resources/database/linguadesk_dictionary.db.gz") {
            Write-Host "Decompressing resources/database/linguadesk_dictionary.db.gz..."
            $inStream = New-Object System.IO.FileStream("resources/database/linguadesk_dictionary.db.gz", [System.IO.FileMode]::Open, [System.IO.FileAccess]::Read)
            $gzStream = New-Object System.IO.Compression.GZipStream($inStream, [System.IO.Compression.CompressionMode]::Decompress)
            $outStream = New-Object System.IO.FileStream("resources/database/linguadesk_dictionary.db", [System.IO.FileMode]::Create, [System.IO.FileAccess]::Write)
            $gzStream.CopyTo($outStream)
            $outStream.Close(); $gzStream.Close(); $inStream.Close()
          }
          Get-ChildItem "resources/ocr" | Format-Table Name, Length

      - name: 4. Create EmbeddedPayload.zip (UI + 147,674 Dictionary + OCR Models + Neural Engine)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stagingDir = Join-Path $env:RUNNER_TEMP "LinguaDeskPro_Payload"
          if (Test-Path $stagingDir) { Remove-Item $stagingDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stagingDir | Out-Null

          Copy-Item -Path "ui" -Destination (Join-Path $stagingDir "ui") -Recurse -Force
          Copy-Item -Path "resources" -Destination (Join-Path $stagingDir "resources") -Recurse -Force
          Copy-Item -Path "scripts" -Destination (Join-Path $stagingDir "scripts") -Recurse -Force

          $zipPath = Join-Path (Resolve-Path "src/LinguaDeskPro.SingleExe").Path "EmbeddedPayload.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path "$stagingDir\*" -DestinationPath $zipPath -CompressionLevel Optimal -Force

          $zipSizeMB = [Math]::Round((Get-Item $zipPath).Length / 1MB, 2)
          Write-Host "EmbeddedPayload.zip created successfully: $zipSizeMB MB"

      - name: 5. Publish Single-File Self-Contained Executable (LinguaDeskPro.exe)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet publish src/LinguaDeskPro.SingleExe/LinguaDeskPro.SingleExe.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -o publish/single-exe

          New-Item -ItemType Directory -Force -Path "dist_artifacts" | Out-Null
          Copy-Item "publish/single-exe/LinguaDeskPro.exe" "dist_artifacts/LinguaDeskPro_v7.0_SingleFile_Portable.exe" -Force
          Get-ChildItem "dist_artifacts" | Format-Table Name, Length

      - name: 6. Build All-In-One Single-File Setup Installer (LinguaDeskPro_Setup_v7.0_AllInOne.exe) via Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $issLines = @(
            "[Setup]",
            "AppId=LinguaDeskPro_v7_MohammedAlbukeer",
            "AppName=LinguaDesk Pro v7.0 Ultimate",
            "AppVersion=7.0.0",
            "AppPublisher=Mohammed Albukeer (mohammedalbukeer@gmail.com)",
            "DefaultDirName={localappdata}\LinguaDeskPro",
            "DefaultGroupName=LinguaDesk Pro",
            "DisableProgramGroupPage=yes",
            "PrivilegesRequired=lowest",
            "OutputDir=dist_artifacts",
            "OutputBaseFilename=LinguaDeskPro_Setup_v7.0_AllInOne",
            "Compression=lzma2/ultra64",
            "SolidCompression=yes",
            "WizardStyle=modern",
            "ArchitecturesInstallIn64BitMode=x64compatible",
            "",
            "[Languages]",
            "Name: `"english`"; MessagesFile: `"compiler:Default.isl`"",
            "",
            "[Tasks]",
            "Name: `"desktopicon`"; Description: `"{cm:CreateDesktopIcon}`"; GroupDescription: `"{cm:AdditionalIcons}`"",
            "",
            "[Files]",
            "Source: `"publish\single-exe\LinguaDeskPro.exe`"; DestDir: `"{app}`"; Flags: ignoreversion",
            "",
            "[Icons]",
            "Name: `"{group}\LinguaDesk Pro`"; Filename: `"{app}\LinguaDeskPro.exe`"",
            "Name: `"{autodesktop}\LinguaDesk Pro`"; Filename: `"{app}\LinguaDeskPro.exe`"; Tasks: desktopicon",
            "",
            "[Run]",
            "Filename: `"{app}\LinguaDeskPro.exe`"; Description: `"Launch LinguaDesk Pro v7.0 Now`"; Flags: nowait postinstall skipifsilent",
            "",
            "[UninstallRun]",
            "Filename: `"taskkill.exe`"; Parameters: `"/F /IM LinguaDeskPro.exe`"; Flags: runhidden; RunOnceId: `"StopLinguaDeskPro`""
          )
          Set-Content -Path "LinguaDeskPro_SingleExe_Setup.iss" -Value ($issLines -join "`r`n") -Encoding UTF8
          iscc "LinguaDeskPro_SingleExe_Setup.iss"
          Get-ChildItem "dist_artifacts" | Format-Table Name, Length

      - name: 7. Publish Single-File EXE Directly to GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "v7.0-latest"
          $files = Get-ChildItem "dist_artifacts\*.exe" | ForEach-Object { $_.FullName }
          Write-Host "Publishing Single-File EXEs to GitHub Release $tag ..."
          gh release upload $tag $files --clobber
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $files --title "LinguaDesk Pro v7.0 Ultimate — Single-File EXE (All-In-One)" --notes "عمل المهندس محمد البكير (Mohammed Albukeer - mohammedalbukeer@gmail.com) - النسخة التنفيذية الموحدة الشاملة (.exe)"
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "SUCCESS! Download your Single-File EXE directly from the Releases section of your GitHub repository!"
